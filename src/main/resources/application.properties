spring.application.name=avistamientos_api

# H2 en modo archivo: los datos persisten entre reinicios
spring.datasource.url=jdbc:h2:file:./data/avistamientos
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza la tabla a partir de la entidad
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web para ver la base de datos en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console